<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Shop Tycoon</title>
<style>
:root{--cream:#F6F0E5;--beige:#E6D7C3;--teal:#285B5B;--green:#47745B;--coral:#E98960;--ink:#343A3A;--red:#CF5C54;--gold:#E8BD63}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#222;font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
[hidden]{display:none!important}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,var(--beige),var(--cream));padding:16px;text-align:center}
#menu h1{margin:0;font-size:clamp(28px,6vw,52px);color:var(--teal)}#menu p{margin:0;color:var(--green)}#msg{min-height:1.4em;color:var(--coral)!important}
.btn{min-width:120px;min-height:40px;padding:8px 16px;border:2px solid var(--teal);border-radius:10px;background:var(--cream);color:var(--teal);font-size:16px;cursor:pointer;font-family:inherit}
#menu .btn{min-width:220px;min-height:48px;font-size:18px}
.btn:hover{background:var(--beige)}.btn.primary{background:var(--teal);color:var(--cream)}.btn.danger{border-color:var(--red);color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}
#gamewrap{position:fixed;inset:0;background:#2A1D14;direction:ltr}#game{width:100%;height:100%;direction:ltr}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.box{background:var(--cream);border-radius:16px;padding:24px;max-width:480px;width:100%;text-align:center}.box h2{margin-top:0;color:var(--teal)}
#err{position:fixed;left:0;right:0;bottom:0;background:#900;color:#fff;padding:10px;font:14px monospace;direction:ltr;z-index:99}
/* ===== نظام تشغيل الكمبيوتر ===== */
#os{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:radial-gradient(circle at 30% 20%,#3b82a0,#1b3a57 60%,#0f1f33)}
#desk{flex:1;position:relative;padding:20px;display:flex;flex-wrap:wrap;gap:18px;align-content:flex-start;overflow:hidden}
.icon{width:92px;text-align:center;color:#fff;font-size:14px;cursor:pointer;text-shadow:0 1px 3px #000}
.icon i{display:block;width:64px;height:64px;margin:0 auto 6px;border-radius:16px;font:bold 30px/64px Tahoma;box-shadow:0 4px 10px rgba(0,0,0,.4);font-style:normal}
.icon.off{opacity:.5;cursor:default}
#win{position:absolute;inset:14px;background:var(--cream);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
#wbar{background:var(--teal);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:bold}
#wbar button{background:var(--red);color:#fff;border:0;border-radius:6px;width:30px;height:28px;cursor:pointer;font-size:16px}
#wbody{flex:1;overflow:auto;padding:14px}
#task{height:42px;background:rgba(10,20,30,.85);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:15px}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;border:2px solid var(--beige);border-radius:12px;padding:12px;text-align:center}
.card h3{margin:6px 0;color:var(--teal)}.card .row{display:flex;justify-content:space-between;font-size:14px;margin:3px 0}
.card .acts{display:flex;gap:8px;justify-content:center;margin-top:8px}.hist{font-size:12px;color:#777;min-height:34px}
.good{color:var(--green);font-weight:bold}.bad{color:var(--red);font-weight:bold}
.cbox{width:90px;height:62px;margin:0 auto;position:relative;background:#C98F55;border-radius:4px 4px 8px 8px;border:3px solid #7A5230}
.cbox:before{content:"";position:absolute;left:36px;top:0;width:16px;height:100%;background:rgba(245,222,170,.85)}
.cbox:after{content:"?";position:absolute;inset:0;font:bold 28px/62px Tahoma;color:rgba(60,35,15,.55);text-align:center}
.cbox.mixed{background:#9AA7B5;border-color:#56606c}.cbox.premium{background:#E8BD63;border-color:#9a7424;box-shadow:0 0 14px rgba(232,189,99,.8)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--beige);text-align:start}
h4{margin:14px 0 6px;color:var(--teal)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:15px}
/* ===== كشف الصندوق ===== */
#reveal{position:fixed;inset:0;z-index:40;background:rgba(15,10,5,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;overflow:auto}
#rbox{width:150px;height:100px;position:relative;background:#C98F55;border:4px solid #7A5230;border-radius:6px;animation:shake .6s 2}
#rbox:before{content:"";position:absolute;left:62px;top:0;width:24px;height:100%;background:rgba(245,222,170,.85)}
#rbox.open{animation:none;transform:scale(.7);opacity:.35;transition:all .5s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
#ritems{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px}
.it{background:var(--cream);border-radius:10px;padding:8px 12px;min-width:130px;text-align:center;font-size:14px;animation:pop .35s}
.it.rare{background:var(--gold);box-shadow:0 0 18px var(--gold);font-weight:bold}.it small{display:block;color:#555}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#rsum{color:#fff;font-size:20px;text-align:center}

.pcard{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--beige);border-radius:12px;padding:8px;margin:6px 0;cursor:default}
.pcard.sel{border-color:var(--teal);background:#eef7f4}.pinfo{display:flex;flex-direction:column;gap:2px;font-size:14px}.pinfo small{color:#666}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:8px;background:var(--beige)}.tag.good{background:#d7efe0}.tag.bad{background:#f6d4d1}

.spanel{background:var(--cream);border-radius:16px;max-width:640px;width:100%;max-height:96vh;overflow:auto;padding:16px}
.shead{display:flex;justify-content:space-between;align-items:center;color:var(--teal);font-size:18px}
#sReq{background:#fff;border:2px solid var(--beige);border-radius:14px;padding:12px;margin:10px 0;font-size:17px}#sMsg{min-height:1.4em;margin-bottom:6px;font-weight:bold}
#sOffer{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}#sOffer input{width:110px;padding:8px;font-size:16px;border-radius:8px;border:2px solid var(--teal)}
.it svg{display:block;margin:0 auto 4px}.cbox.bulk{background:#8fa89a;border-color:#4e6a5c}.cbox.cracked{background:#b98a8a;border-color:#7a4e4e}.cbox.select{background:#E8BD63;border-color:#9a7424;box-shadow:0 0 14px rgba(232,189,99,.8)}.hint{font-size:12px;color:#666}

.spanel.wide{max-width:900px}
#rep{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:10px}
#report{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:10px}
.bar{margin:8px 0;font-size:15px}.steps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.steps span{padding:3px 9px;border-radius:10px;background:var(--beige);font-size:13px}.steps .dn{background:#d7efe0}.steps .cu{background:var(--gold);font-weight:bold}
.tools{margin:6px 0}.tools .btn.sel{background:var(--teal);color:#fff}.msgline{min-height:1.4em;margin:6px 0;font-weight:bold}
.bench{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;justify-content:center;direction:ltr}.pstage{position:relative;width:200px;height:400px;direction:ltr;background:#f0e6d4;border-radius:20px;touch-action:none;user-select:none}
.side{width:260px;direction:rtl}.tray{min-height:120px;border:3px dashed #8a7a66;border-radius:12px;padding:10px;background:#fff;text-align:center}
.hs{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(232,189,99,.95);border:3px solid #fff;transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.hs.screw{background:#9aa;border-color:#555}.hs.tst{background:#6FE0D4}.hs.pry{background:#E98960}.hs.dn{opacity:.3}.hs.pulse{animation:pls 0.8s infinite}
@keyframes pls{50%{transform:translate(-50%,-50%) scale(1.45)}}
.part{position:absolute;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:grab;touch-action:none;border:2px solid #fff;text-align:center}
.slot{position:absolute;border:3px dashed var(--gold);border-radius:8px;background:rgba(232,189,99,.15)}
.chip{display:inline-block;background:#fff;border:2px solid var(--teal);border-radius:8px;padding:8px 10px;margin:4px;cursor:grab;touch-action:none;position:relative;font-size:14px}
.done{text-align:center}
#repoBody table td:last-child{text-align:left}
/* ===== v0.5: لابتوب + سوق + ورشة ملء الشاشة ===== */
#os{background:radial-gradient(ellipse at 20% 15%,#3d8fc0 0,transparent 45%),radial-gradient(ellipse at 85% 80%,#8a5fc9 0,transparent 50%),linear-gradient(135deg,#16324f,#1b1f4b 60%,#2a1b4a)}
#desk{flex:1;position:relative;padding:20px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:16px;overflow:hidden}
.icon{width:96px;text-align:center;color:#fff;font-size:13px;cursor:pointer;text-shadow:0 1px 3px #000}.icon i{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 6px;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.4);transition:.15s}.icon i svg{width:34px;height:34px}.icon:hover i{transform:translateY(-3px) scale(1.05)}
#win{position:absolute;inset:18px 18px 12px;background:#f4f1ea;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.65);display:flex;flex-direction:column;overflow:hidden;animation:winpop .2s}
@keyframes winpop{from{transform:scale(.94);opacity:0}}
.tbar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:linear-gradient(#eceff3,#d9dde3);direction:ltr;border-bottom:1px solid #bfc5cc}
.dots{display:flex;gap:7px}.d{width:13px;height:13px;border-radius:50%;display:block;cursor:pointer}.d.r{background:#ff5f57}.d.y{background:#febc2e}.d.g{background:#28c840}
#wtitle{font-weight:bold;color:#333;font-size:14px;flex:0 0 auto}#waddr{flex:1;background:#fff;border-radius:16px;padding:4px 14px;font-size:12px;color:#444;direction:ltr;border:1px solid #cfd4da}
#wbody{flex:1;overflow:auto;min-height:0}
#task{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(14,22,34,.78);backdrop-filter:blur(12px);color:#fff;font-size:13px;gap:12px;position:relative;direction:ltr}

.tray{display:flex;align-items:center;gap:12px}
#smenu{position:absolute;bottom:60px;left:14px;width:230px;background:rgba(20,28,42,.96);border-radius:14px;padding:8px;direction:rtl}.sm{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}.sm:hover{background:rgba(255,255,255,.1)}.sm i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}.sm svg{width:18px;height:18px}.sm.off{color:#ff9a8f;margin-top:4px;border-top:1px solid rgba(255,255,255,.12)}
.ah{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#e5532e,#ff9a56);color:#fff;flex-wrap:wrap}.ah small{margin-inline-start:auto;opacity:.92}.live{display:flex;align-items:center;gap:5px;font-size:13px}.live i{width:9px;height:9px;border-radius:50%;background:#fff;animation:pls2 1s infinite}@keyframes pls2{50%{opacity:.2}}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:16px}
.lot{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.1);text-align:center}.lot-i{position:relative;height:118px;display:grid;place-items:center}.timer{position:absolute;top:0;left:0;background:#2a1d14;color:#fff;border-radius:12px;padding:3px 10px;font-weight:bold;font-size:14px}.timer.hot{background:#cf5c54;animation:pls2 .6s infinite}
.lot h3{margin:6px 0;color:var(--teal)}.price{font-size:26px;font-weight:bold;color:#2a1d14;margin:6px 0}.lot .row{display:flex;justify-content:space-between;font-size:14px;margin:3px 0}.lot .hist{min-height:46px;font-size:12px;color:#666}.lot .hist div{display:flex;justify-content:space-between}.lot .acts{display:flex;gap:8px;justify-content:center;margin-top:8px}.empty{text-align:center;color:#888;padding:30px}
.fm{display:flex;height:100%}.fm-side{width:170px;background:#e9e4da;padding:10px;display:flex;flex-direction:column;gap:6px;flex:0 0 170px}.fs{padding:10px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between}.fs.on{background:var(--teal);color:#fff}.fm-main{flex:1;padding:14px;overflow:auto}
.chipsrow,.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.cp{border:0;background:#e6dfd2;border-radius:18px;padding:6px 14px;cursor:pointer;font-family:inherit}.cp.on{background:var(--teal);color:#fff}

.pc-i{position:relative;flex:0 0 64px;display:grid;place-items:center}.rare{position:absolute;top:-6px;right:-10px;background:var(--gold);font-size:11px;padding:1px 6px;border-radius:8px;font-weight:bold}

.pc-f{display:flex;justify-content:space-between;align-items:center;gap:6px}.bdg{font-size:12px;padding:2px 9px;border-radius:10px;background:#eee}.bdg.good{background:#d7efe0;color:#1f6b45}.bdg.bad{background:#f8d9d6;color:#a23b34}.pr{font-weight:bold;color:var(--teal)}.cst{color:#999}.tot{text-align:end;color:#555}

    self.hotspot(s.x, s.y, s.w, s.h, function () {

      else openModal(s.n, 'سيتم تنفيذ هذا الجزء في مرحلة لاحقة.');
    }, im, 'front');
    if (s.n) self.add.text(s.x + s.w / 2, s.y + s.h + (s.y > 500 ? -10 : 12), s.n, { resolution:2, fontFamily:FONT, fontSize:'16px', color:'#343A3A', fontStyle:'bold', backgroundColor:'#F6F0E5', padding:{ x:6, y:2 } }).setOrigin(0.5).setAlpha(0.92).setDepth(7);
  });
  HOTB.forEach(function (s) {
    var o = makeOutline(OBJB[s.k], s.x - 20, s.y - 20, s.w + 40, s.h + 40, RS); self.textures.addCanvas('olb_' + s.k, o.cv);
    var im = self.add.image(BX + s.x - 20 - o.pad, s.y - 20 - o.pad, 'olb_' + s.k).setOrigin(0).setScale(1 / o.rs).setAlpha(0).setDepth(6);
    self.hotspot(BX + s.x, s.y, s.w, s.h, function () { if (s.k === 'repair') openRepair(); else if (s.k === 'clean') openClean(); else self.turn('front'); }, im, 'back');
    if (s.n) self.add.text(BX + s.x + s.w / 2, s.y - 8, s.n, { resolution:2, fontFamily:FONT, fontSize:'20px', color:'#fff', fontStyle:'bold', backgroundColor:'#285B5B', padding:{ x:10, y:4 } }).setOrigin(0.5).setDepth(7);
  });
  this.hotspot(540, 235, 200, 265, openServe, function () { return self.custOl; }, 'front');
  this.tag = this.add.text(640, 186, '', { resolution:2, fontFamily:FONT, fontSize:'17px', color:'#fff', backgroundColor:'#555', padding:{ x:12, y:8 }, align:'center', wordWrap:{ width:290 } }).setOrigin(0.5).setDepth(8);
  this.bar = this.add.graphics().setDepth(8);
  this.badge = this.add.text(1170, 226, '0', { resolution:2, fontFamily:FONT, fontSize:'18px', color:'#fff', backgroundColor:'#CF5C54', padding:{ x:8, y:3 } }).setOrigin(1, 0.5).setDepth(8);
  window._scene = this; this._ck = ''; this._cid = 0; this._ds = null; updateHud();
};
ShopScene.prototype.hotspot = function (x, y, w, h, fn, ol, view) {
  var sc = this;
  function img() { return typeof ol === 'function' ? ol() : ol; }
  var z = this.add.rectangle(x + w / 2, y + h / 2, w, h, 0xffffff, 0.001).setInteractive({ useHandCursor:true });
  function ok() { return !uiOpen() && !sc.moving && sc.view === view && !sc.arriving; }
  z.on('pointerover', function () { var i = img(); if (i && ok()) i.setAlpha(1); }); z.on('pointerout', function () { var i = img(); if (i) i.setAlpha(0); });
  z.on('pointerdown', function () { if (ok()) fn(); });
};
ShopScene.prototype.syncDisp = function () {
  var list = dispPhones(), sig = list.map(function (p) { return p.id; }).join(',');
  if (sig === this._ds) return; this._ds = sig;
  var cx = this.dispTex.getContext(); cx.setTransform(RS, 0, 0, RS, 0, 0); cx.clearRect(0, 0, 220, 328); drawDispPhones(cx, list); this.dispTex.refresh();
};
ShopScene.prototype.leaveAnim = function () {      // الزبون يمشي ناحية الباب (بيصغر ويختفي)
  var sc = this, src = this.custTex.canvas, cv = document.createElement('canvas'); cv.width = src.width; cv.height = src.height; cv.getContext('2d').drawImage(src, 0, 0);
  var key = 'out' + (this._on = (this._on || 0) + 1); this.textures.addCanvas(key, cv);
  var im = this.add.image(this.custImg.x, this.custImg.y, key).setOrigin(0.5, 0).setScale(1 / RS).setDepth(2);
  this.tweens.add({ targets:im, scale:0.5 / RS, alpha:0, y:128, duration:950, ease:'Sine.easeIn', onComplete:function () { im.destroy(); sc.textures.remove(key); } });
};
ShopScene.prototype.enterAnim = function () {      // الزبون يدخل من الباب ويمشي لحد الكاونتر (بيكبر)
  var sc = this; this.arriving = true; this.custImg.setX(640).setY(128).setAlpha(0).setScale(0.5 / RS).setVisible(true); this.tag.setVisible(false);
  this.tweens.add({ targets:this.custImg, scale:1 / RS, y:150, duration:1250, ease:'Sine.easeOut', onComplete:function () { sc.arriving = false; sc.custImg.setAlpha(1); sc.tag.setVisible(true); } });
  this.tweens.add({ targets:this.custImg, alpha:1, duration:420 });
};
ShopScene.prototype.syncCust = function () {
  var c = S.queue[0], ck = c ? c.id : 0, f = c ? c.pat / c.patMax : 1, mood = f > 0.5 ? 0 : f > 0.25 ? 1 : 2, sig = ck + '-' + mood;
  if (sig !== this._ck) {
    var changed = ck !== this._cid;
    if (changed && this._cid && this.custImg.visible) this.leaveAnim();
    this._ck = sig; this._cid = ck;
    var cx = this.custTex.getContext(); cx.setTransform(RS, 0, 0, RS, 0, 0); cx.clearRect(0, 0, 320, 440);
    if (c) { c.look.mood = mood; drawPerson(cx, c.look); this.tag.setText(c.type === 'fawry' ? fwReq(c) : c.type === 'pickup' ? 'جاي ياخد حجزه من شاري' : c.type === 'courier' ? 'مندوب البريد جاي يستلم شحنة' : TYL[c.type]).setBackgroundColor(TYC[c.type]); } else { this.tag.setText('لا أحد في المحل الآن').setBackgroundColor('#555'); }
    this.custTex.refresh(); this.custImg.setVisible(!!c);
    if (this.custOl) { this.custOl.destroy(); this.custOl = null; if (this.textures.exists('custol')) this.textures.remove('custol'); }
    if (c) { var o = makeOutline(function (cc) { drawPerson(cc, c.look); }, 0, 0, 320, 350, RS); o.cv.getContext('2d').clearRect(0, (350 + o.pad) * o.rs, o.cv.width, o.cv.height); this.textures.addCanvas('custol', o.cv); this.custOl = this.add.image(480 - o.pad, 150 - o.pad, 'custol').setOrigin(0).setScale(1 / o.rs).setAlpha(0).setDepth(6); }
    if (changed && c) this.enterAnim();
  }
  this.tag.setVisible(!this.arriving);
  this.bar.clear();
  if (c && !this.arriving) { var fr = Math.max(0, f); this.bar.fillStyle(0x000000, 0.5).fillRect(580, 224, 120, 8).fillStyle(fr > 0.5 ? 0x4F956B : fr > 0.25 ? 0xD49B38 : 0xCF5C54).fillRect(580, 224, 120 * fr, 8); }
};
function updateHud() {
  var sc = window._scene;
  if (S) {
    $('hDay').textContent = 'يوم ' + S.day + ' - ' + fmtClock(clockMin()); $('hRep').textContent = '\u2605 ' + S.reputation; $('hWait').textContent = S.queue.length ? 'زبون ينتظر' : 'لا زبون'; $('hCash').textContent = money(S.cash);
    var un = S.threads.filter(function (t) { return t.unread; }).length, sb = $('shBadge'); if (sb) { sb.textContent = un; sb.hidden = !un; }
    var tc = $('tCash'); if (tc) tc.textContent = money(S.cash); var tk = $('tClock'); if (tk) tk.textContent = fmtClock(clockMin()) + ' | يوم ' + S.day;
  }
  if (sc && S && sc.badge && sc.sys && sc.sys.isActive()) { sc.badge.setText(String(S.inv.boxes.length)).setVisible(S.inv.boxes.length > 0); sc.syncDisp(); sc.syncCust(); }
}
function gameLoop() {
  if (!S || reportOpen || $('gamewrap').hidden) return;
  var r = tickGame(); ticks++; if (ticks % 10 === 0) save();
  if (r === 'dayend') { showReport(true); return; }
  updateHud();
  var tk2 = S.threads.length + '-' + S.res.length + '-' + S.ads.length + '-' + S.ships.length; if (gameLoop._th !== tk2) { gameLoop._th = tk2; if (!$('os').hidden && ((curApp === 'shari' && shTab !== 'post') || (curApp === 'barid' && !bdReview))) renderApp(); }
  var n = S.orders.length; if (gameLoop._n !== n) { gameLoop._n = n; if (!$('os').hidden && curApp === 'parts') renderApp(); if (!$('rep').hidden && !repSel) renderRep(); }
  document.querySelectorAll('[data-eta]').forEach(function (el) { var o = S.orders.filter(function (x) { return String(x.id) === el.dataset.eta; })[0]; if (o) el.textContent = eta(o); });
  document.querySelectorAll('[data-trk]').forEach(function (el) { var o = S.orders.filter(function (x) { return String(x.id) === el.dataset.trk; })[0]; if (o) el.innerHTML = trk(o); });
}

/* ===== القائمة والتحكم ===== */
var loopT = null;
function say(m) { $('msg').textContent = m; }
function startGame(state) {
  S = state; $('menu').hidden = true; $('gamewrap').hidden = false; $('hud').hidden = false; goFull();
  var dpr = Math.min(window.devicePixelRatio || 1, 2); window._dpr = dpr;
  game = new Phaser.Game({ type:Phaser.AUTO, parent:'game', width:Math.round(window.innerWidth * dpr), height:Math.round(window.innerHeight * dpr), backgroundColor:'#2A1D14', input:{ windowEvents:false }, scale:{ mode:Phaser.Scale.NONE, zoom:1 / dpr }, scene:[ShopScene] });
  if (!loopT) loopT = setInterval(gameLoop, 1000);
}
function toMenu() {
  clearRT(); if (aTimer) { clearInterval(aTimer); aTimer = null; } if (loopT) { clearInterval(loopT); loopT = null; } save(); window._scene = null; if (game) { game.destroy(true); game = null; }
  ['modal', 'os', 'reveal', 'sale', 'rep', 'report', 'cs', 'clean', 'inside', 'shelf', 'hud', 'gamewrap'].forEach(function (i) { $(i).hidden = true; }); reportOpen = false; $('menu').hidden = false; $('bCont').disabled = !hasSave();
}
$('bNew').onclick = function () { S = newState(); save(); startGame(S); };
$('bCont').onclick = function () { var r = loadSave(); if (r.state) startGame(r.state); else { say(r.corrupt ? 'ملف الحفظ تالف أو قديم. تم الاحتفاظ بنسخة احتياطية.' : 'لا يوجد حفظ سابق'); $('bCont').disabled = !hasSave(); } };
$('bReset').onclick = function () { if (confirm('هل تريد مسح التقدم نهائيًا؟')) { localStorage.removeItem(SAVE_KEY); say('تم مسح الحفظ'); $('bCont').disabled = true; } };
$('mClose').onclick = function () { $('modal').hidden = true; };
$('rSkip').onclick = function () { if (window._skip) window._skip(); };
$('rClose').onclick = function () { clearRT(); $('reveal').hidden = true; renderApp(); };
$('sx') && ($('sx').onclick = closeSale);
$('bCont').disabled = !hasSave();

$('hFull').onclick = goFull; $('hMenu').onclick = function () { if (!uiOpen()) toMenu(); };
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (!$('modal').hidden) $('modal').hidden = true; else if (!$('sale').hidden) closeSale(); else if (!$('cs').hidden) closeMachine(); else if (!$('clean').hidden) closeClean(); else if (!$('rep').hidden) closeRep(); else if (!$('shelf').hidden) closeShelf(); else if (!$('os').hidden) closeOS();
});

window.addEventListener('resize', function () { if (game) { var d = window._dpr || 1; game.scale.resize(Math.round(window.innerWidth * d), Math.round(window.innerHeight * d)); } });

</script>
